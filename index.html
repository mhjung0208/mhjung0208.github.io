<!DOCTYPE html>

  <meta property="og:type" content="website">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:url" content="https://mhjung0208.github.io/">

  <meta property="og:image:height" content="630">

  <!-- Hero 이미지(LCP 후보)를 먼저 받아온다 -->
  <link rel="preload" as="image" href="data/Images/hero-photo.webp" imagesrcset="data/Images/hero-photo-640.webp 640w, data/Images/hero-photo.webp 1600w" imagesizes="(min-width: 1024px) 34vw, 60vw" fetchpriority="high">
  <!-- 한글 본문 폰트: Pretendard Variable (버전 고정, 실패 시 시스템 폰트로 폴백) -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Pretendard Variable"', 'Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', '"Apple SD Gothic Neo"', '"Malgun Gothic"', 'sans-serif']
          },
          colors: {
            // accent: 장식·큰 글자용 / accent-ink: 작은 텍스트·링크용(미색 바탕 5.3:1) / accent-deep: 버튼 배경(흰 글자 5.6:1)
            accent: { DEFAULT: '#e8604c', light: '#ee7e6d', dark: '#d4503e', ink: '#b4412f', deep: '#b4412f', deeper: '#93331f' },
            warm: { 50: '#faf7f2', 100: '#f3ede4', 200: '#e8dfd3', 300: '#d6cbbc' },
            // 회색도 미색 팔레트에 맞춘 따뜻한 회색으로 교체(500 이상은 본문 대비 4.5:1 이상)
            gray: {
              50: '#faf8f5', 100: '#f3efe9', 200: '#e6e0d7', 300: '#d3cbc0', 400: '#a1988c',
              500: '#6b645c', 600: '#57514a', 700: '#433e38', 800: '#2f2b27', 900: '#211e1b'
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/style.css">

        <a href="#hero" id="nav-logo" class="text-lg font-bold text-gray-900 tracking-tight"></a>

        <!-- 데스크톱 메뉴 -->
        <div class="hidden md:flex items-center gap-7">

        <button id="menu-toggle" type="button" class="md:hidden w-11 h-11 -mr-2 rounded-md text-gray-700 flex items-center justify-center" aria-label="메뉴 열기" aria-expanded="false" aria-controls="mobile-menu">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path id="menu-icon" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
      </div>

      <!-- 모바일 메뉴 -->
      <div id="mobile-menu" class="hidden md:hidden pb-3 border-t border-warm-200">
        <a href="#about" class="mobile-nav-link block py-2.5 text-gray-700">담당 기능</a>
        <a href="#experience" class="mobile-nav-link block py-2.5 text-gray-700">경력</a>
        <a href="#skills" class="mobile-nav-link block py-2.5 text-gray-700">기술</a>

        <a href="#education" class="mobile-nav-link block py-2.5 text-gray-700">학력</a>

    </div>
  </nav>

  <main id="main">

    <section id="hero" class="hero" aria-label="소개 요약">

    <section id="about" class="section" aria-labelledby="about-title">
      <div class="section-inner">
        <header class="section-head">
          <h2 id="about-title" class="section-title">담당 기능</h2>
          <p class="section-label" lang="en">Features</p>
        </header>
        <div id="about-content" class="section-body"></div>
      </div>
    </section>

    <section id="experience" class="section" aria-labelledby="experience-title">
      <div class="section-inner">
        <header class="section-head">
          <h2 id="experience-title" class="section-title">경력</h2>
          <p class="section-label" lang="en">Experience</p>
        </header>
        <div id="experience-content" class="section-body"></div>
      </div>
    </section>

    <section id="skills" class="section" aria-labelledby="skills-title">

    <section id="projects" class="section" aria-labelledby="projects-title">

        </header>
        <div id="projects-content" class="section-body"></div>
      </div>
    </section>

    <section id="education" class="section" aria-labelledby="education-title">

    <section id="contact" class="section" aria-labelledby="contact-title">

        <header class="section-head">
          <h2 id="contact-title" class="section-title">연락</h2>
          <p class="section-label" lang="en">Contact</p>
        </header>

  <!-- 푸터 -->

  <!-- 스크롤 상단 이동 버튼 -->
  <button id="scroll-top" type="button" class="fixed bottom-6 right-6 w-12 h-12 bg-accent-deep text-white rounded-full shadow-md hover:bg-accent-deeper flex items-center justify-center z-30" aria-label="맨 위로 이동">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"/>
    </svg>
  </button>

  <!-- 프로젝트 상세 모달 -->
